[mcp_servers.contextd]
command = "__CONTEXTD_REPO__/.venv/bin/ctx"
args = ["serve"]
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.contextd.env]
CONTEXTD_CLIENT = "codex"

# NOTE: headless `codex exec` cancels MCP tool calls ("user cancelled" with no
# user present to approve) regardless of approval_policy/timeouts. Interactive
# Codex (TUI / ChatGPT app), which reads this same config, has a user to approve
# the call — CONFIRMED working: an interactive recall logged egress as
# client=codex (audit #40939). So the exec cancellation is the missing approval,
# not a contextd or protocol issue; direct MCP stdio also works headless.
