[mcp_servers.contextd]
command = "/Users/joseph/contextd/.venv/bin/ctx"
args = ["serve"]
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.contextd.env]
CONTEXTD_CLIENT = "codex"

# NOTE: headless `codex exec` auto-cancels MCP tool calls ("user cancelled" with
# no user present) regardless of approval_policy/timeouts — a Codex exec-mode
# limitation, not a contextd issue. Interactive Codex (TUI / ChatGPT app), which
# reads this same config, has a user to approve the call. Verified working via
# direct MCP stdio: recall logged egress as client=codex-probe / client=timing.
