name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # [pqc] pins the `cryptography` floor that exposes native ML-DSA, so the
      # post-quantum checkpoint tests actually execute here instead of skipping
      # on whatever version the base floor happens to resolve to.
      - run: pip install -e '.[dev,pqc]'
      - run: ruff check .
      - run: pytest -q
      - run: python tests/smoke.py
