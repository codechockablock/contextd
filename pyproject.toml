[project]
name = "contextd"
version = "0.0.1"
description = "Personal context daemon: append-only life log + index + gate, served over MCP."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=2"]

[project.scripts]
ctx = "contextd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contextd"]
