[project]
name = "contextd"
version = "0.6.0"
description = "Personal context daemon: append-only life log + index + gate, served over MCP."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
# `cryptography` is imported unguarded at module scope by attest.py, ledger_sig.py,
# backup.py, export_crypto.py, and cli.py — it is what signs operator actions, the
# event chain, and sealed exports. It was previously undeclared and arrived only
# because mcp depends on pyjwt[crypto]. That worked, but it made the archive's
# cryptographic identity a side effect of the MCP transport's JWT handling: drop
# the transport, or drop its extra, and signing fails at import. The inherited
# floor was also whatever pyjwt accepts (>=3.4.0, 2021), which is not a floor this
# project should sign under.
dependencies = ["mcp>=2", "cryptography>=42"]

[project.optional-dependencies]
# Three extras, each documented at its declaration below and summarized in
# README.md ("Install"). None of them is required for the default single-host
# SQLite archive, and installing one never migrates an existing archive:
#
#   dev       pytest + ruff, the gate battery in scripts/gates.sh
#   pqc       a cryptography VERSION FLOOR for ML-DSA checkpoints — not a
#             new library, and off by default even once installed
#   postgres  psycopg, for multi-host archives only
dev = ["pytest>=8", "ruff>=0.12"]
# Post-quantum checkpoint signing (ML-DSA / FIPS 204). This extra is a VERSION
# FLOOR, not a new library: `cryptography` >= 47 exposes ML-DSA natively via
# OpenSSL, so there is no third-party PQC dependency, no C toolchain to build,
# and no upstream production disclaimer to inherit. The base install stays at
# >=42 so nothing regresses for deployments that do not want the floor raised;
# checkpoint signing degrades to classical-only and says so rather than
# failing. Note the floor is necessary but not sufficient — the schemes are
# implemented by the linked OpenSSL, so ledger_sig.pq_available() probes for
# the capability instead of inferring it from a version number.
pqc = ["cryptography>=47"]
# Multi-host archives only. SQLite remains the default and requires nothing
# extra, so an existing single-host install is unaffected by this extra
# existing and is never migrated by installing it.
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
ctx = "contextd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Subpackages are not implied by the parent: without `contextd.backends` listed
# here an installed wheel imports `contextd` fine and then fails on the first
# `connect()`, which the test suite would not catch because it runs from the
# source tree.
packages = ["contextd", "contextd.backends"]

[tool.pytest.ini_options]
# experiments/ and hooks/ are harness-side scripts deliberately outside the
# installed contextd package (models call the kernel; the kernel never calls
# models), so tests can only import them with the repo root on sys.path.
# Local `python -m pytest` got that from the CWD; the bare `pytest` script in
# CI does not, hence this explicit rootdir-relative entry.
pythonpath = ["."]
# runs/ holds benchmark receipts, including deliberately interrupted scratch
# repos whose tests fail by design; they are artifacts, not this suite.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["runs"]

[tool.ruff.lint]
# Ruff's default correctness set, pinned so upgrades do not silently enable
# stylistic/preview rules across the historical experiment corpus.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This executable regression script must configure an isolated archive before
# importing contextd, and deliberately imports later features beside each case.
"tests/smoke.py" = ["E402"]
